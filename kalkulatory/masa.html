/* Layout: sticky header with project name + step rail; each step is a working sheet like a lab form */
:root{
  --bg:#E4E1DB; --sheet:#ECEAE5; --ink:#262521; --muted:#6B6760; --line:#CBC7BF; --line-strong:#A39E95;
  --accent:#B3302D; --accent-ink:#ffffff; --accent-soft:rgba(179,48,45,.10);
  --band:#A8812C; --band-soft:rgba(168,129,44,.16); --curve:#262521; --target:#3F6E8C;
  --ok:#2E7350; --ok-soft:rgba(46,115,80,.13); --bad:#B23A30; --bad-soft:rgba(178,58,48,.12); --warn:#946A12; --warn-soft:rgba(168,129,44,.16);

  --f-body:"DM Sans",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Consolas,monospace;
  --r:4px; color-scheme:light;
}

  --bg:#0B0B0C; --sheet:#141416; --ink:#F2F0EC; --muted:#8F8C86; --line:#2A2A2E; --line-strong:#4A4A50;
  --accent:#D0302F; --accent-ink:#ffffff; --accent-soft:rgba(208,48,47,.14);
  --band:#C9A24A; --band-soft:rgba(201,162,74,.13); --curve:#F2F0EC; --target:#7FA9C4;
  --ok:#6FB287; --ok-soft:rgba(111,178,135,.14); --bad:#E5605C; --bad-soft:rgba(229,96,92,.14); --warn:#D9A441; --warn-soft:rgba(217,164,65,.14); color-scheme:dark}}

<script>/* ===== MASA-W engine: optimisation, binder, trial mix, plant recipe ===== */
const SIEVES = [0.063, 0.125, 0.25, 0.5, 1, 2, 4, 5.6, 8, 11.2, 16, 22.4, 31.5, 45, 63];

/* ---------- dense linear algebra ---------- */
function solveLin(M, r) {
  const n = r.length, A = M.map((row, i) => row.slice().concat([r[i]]));
  for (let c = 0; c < n; c++) {
    let p = c;
    for (let i = c + 1; i < n; i++) if (Math.abs(A[i][c]) > Math.abs(A[p][c])) p = i;
    if (Math.abs(A[p][c]) < 1e-300) A[p][c] = 1e-300;
    [A[c], A[p]] = [A[p], A[c]];
    for (let i = c + 1; i < n; i++) {
      const f = A[i][c] / A[c][c];
      if (f) for (let k = c; k <= n; k++) A[i][k] -= f * A[c][k];
    }
  }
  const x = new Array(n).fill(0);
  for (let i = n - 1; i >= 0; i--) {
    let s = A[i][n];
    for (let k = i + 1; k < n; k++) s -= A[i][k] * x[k];
    x[i] = s / A[i][i];
  }
  return x;
}

/* ---------- convex QP, primal-dual interior point (Mehrotra) ----------
   min 1/2 x'Hx + c'x   s.t.  Aeq x = beq,  G x <= h                    */
function qp(H, c, Aeq, beq, G, h, opt = {}) {
  const n = c.length, p = Aeq.length, m = G.length;
  const reg = opt.reg ?? 1e-9;
  let x = opt.x0 ? opt.x0.slice() : new Array(n).fill(0);
  let y = new Array(p).fill(0);
  let s = G.map((g, i) => Math.max(h[i] - dot(g, x), 1));
  let z = new Array(m).fill(1);
  const mv = (M, v) => M.map(r => dot(r, v));
  const mtv = (M, v, n) => { const o = new Array(n).fill(0); M.forEach((r, i) => r.forEach((a, j) => o[j] += a * v[i])); return o; };
  let it, converged = false;
  for (it = 0; it < 200; it++) {
    const Hx = mv(H, x);
    const rd = Hx.map((v, j) => v + c[j]);
    mtv(Aeq, y, n).forEach((v, j) => rd[j] += v);
    mtv(G, z, n).forEach((v, j) => rd[j] += v);
    const rp = Aeq.map((a, i) => dot(a, x) - beq[i]);
    const rg = G.map((g, i) => dot(g, x) + s[i] - h[i]);
    const mu = m ? dot(s, z) / m : 0;
    const res = Math.max(norm(rd), norm(rp), norm(rg));
    if (res < 1e-8 && mu < 1e-10) { converged = true; break; }
    // reduced KKT matrix
    const W = z.map((zi, i) => zi / s[i]);
    const K = H.map((r, i) => r.map((v, j) => v + (i === j ? reg : 0)));
    for (let k = 0; k < m; k++) { const g = G[k], w = W[k]; for (let i = 0; i < n; i++) if (g[i]) for (let j = 0; j < n; j++) K[i][j] += w * g[i] * g[j]; }
    const N = n + p;
    const KKT = [];
    for (let i = 0; i < n; i++) KKT.push(K[i].concat(Aeq.map(a => a[i])));
    for (let i = 0; i < p; i++) KKT.push(Aeq[i].concat(new Array(p).fill(0)));
    const step = (rc) => {
      const t = rc.map((v, i) => (v + z[i] * rg[i]) / s[i]);
      const r1 = mtv(G, t, n).map((v, j) => -rd[j] - v);
      const sol = solveLin(KKT, r1.concat(rp.map(v => -v)));
      const dx = sol.slice(0, n), dy = sol.slice(n);
      const ds = G.map((g, i) => -rg[i] - dot(g, dx));
      const dz = z.map((zi, i) => (rc[i] - zi * ds[i]) / s[i]);
      return { dx, dy, ds, dz };
    };
    const maxStep = (v, dv) => { let a = 1; for (let i = 0; i < v.length; i++) if (dv[i] < 0) a = Math.min(a, -v[i] / dv[i]); return a; };
    // predictor
    const aff = step(s.map((si, i) => -si * z[i]));
    const aP = Math.min(maxStep(s, aff.ds), maxStep(z, aff.dz));
    const muAff = m ? s.reduce((acc, si, i) => acc + (si + aP * aff.ds[i]) * (z[i] + aP * aff.dz[i]), 0) / m : 0;
    const sigma = mu > 0 ? Math.pow(muAff / mu, 3) : 0;
    // corrector
    const d = step(s.map((si, i) => -si * z[i] - aff.ds[i] * aff.dz[i] + sigma * mu));
    const a = Math.min(1, 0.99 * Math.min(maxStep(s, d.ds), maxStep(z, d.dz)));
    for (let j = 0; j < n; j++) x[j] += a * d.dx[j];
    for (let j = 0; j < p; j++) y[j] += a * d.dy[j];
    for (let j = 0; j < m; j++) { s[j] += a * d.ds[j]; z[j] += a * d.dz[j]; }
  }
  return { x, converged, iterations: it };
}
const dot = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };
const norm = v => v.reduce((m, a) => Math.max(m, Math.abs(a)), 0);

/* ---------- mix design ----------
   mats: [{passing:[...SIEVES.length], min, max, price}]
   spec: {lower, upper, target, active:[bool], weight:[num]}
   mode: 'grading' | 'cost' | 'free' (no limits)                        */
function combine(mats, x) {
  return SIEVES.map((_, j) => mats.reduce((s, m, i) => s + x[i] * m.passing[j] / 100, 0));

function binder() { return S.binders.find(b => b.id === S.binderId) || S.binders[0]; }
function currentX() { if (S.design?.x?.length !== S.mats.length) return null; const s = S.design.x.reduce((p, q) => p + (+q || 0), 0); return s > 0 ? S.design.x.map(v => (+v || 0) * 100 / s) : null; }
function rawSum() { return S.design?.x ? S.design.x.reduce((p, q) => p + (+q || 0), 0) : 0; }
function currentY() { const x = currentX(); return x ? combine(S.mats, x) : null; }
function binderResults() {
  const Y = currentY(); if (!Y) return null;
  const x = currentX(), rhoAgg = aggDensity(S.mats, x), rhoB = binder().density;
  const ctx = { Y, rhoAgg }, p = S.binder.p, out = {};
  const emp = { ...p.empirical, z: p.empirical.z ?? defaultEmpiricalZ(Y[0]) };
  out.voids = binderMethods.voids({ P: p.voids.P, n: p.voids.n, rhoB, rhoAggBulk: p.voids.gkp }, ctx);
  out.film = binderMethods.film({ ...p.film, rhoB }, ctx);
  out.duriez = binderMethods.duriez(p.duriez, ctx);
  out.empirical = { ...binderMethods.empirical(emp, ctx), zUsed: emp.z };

/* ---------- obliczenie składu ---------- */
function runDesign(mode, silent) {
  if (S.mats.length < 2 || S.mats.length > 9) { if (!silent) toast('Mieszanka mineralna może się składać z 2 ÷ 9 materiałów.'); return; }
  if (matsWithErr().length) { toast(gErrMsg(matsWithErr()[0])); return; }
  if (mode === 'cost' && !S.mats.some(m => +m.price > 0)) { if (!silent) toast('Wprowadź CENY MATERIAŁÓW SKŁADOWYCH.'); return; }
  const r = designMix(S.mats, S.spec, mode);
  if (!r.ok) { toast(r.error); return; }
  if (r.x.some(v => !isFinite(v))) { toast('Obliczenia nie zbiegły się. Sprawdź dane materiałów.'); return; }
  S.design = { mode, x: r.x.map(v => Math.round(v * 100) / 100), infeasible: r.infeasible, violated: r.violated, manual: false };
  const diff = 100 - S.design.x.reduce((a, b) => a + b, 0); const k = S.design.x.indexOf(Math.max(...S.design.x)); S.design.x[k] = Math.round((S.design.x[k] + diff) * 100) / 100;
  designDirty = false;
  if (!silent) toast(r.infeasible ? 'Brak rozwiązania w krzywych granicznych – pokazano mieszankę najbliższą granicom.' : 'Obliczono skład mieszanki.');
}

/* ---------- sita ---------- */
function sieveStatus(Y) {
  return SIEVES.map((_, j) => { const lo = S.spec.lower[j], up = S.spec.upper[j]; if (lo == null || up == null) return 'na'; if (Y[j] < lo - 0.05) return 'low'; if (Y[j] > up + 0.05) return 'high'; return 'ok'; });
}
function autoMaxSito() { let j = SIEVES.findIndex((_, k) => S.spec.lower[k] >= 100); return j < 0 ? SIEVES.length - 1 : j; }
function visibleSieves() { const jm = S.spec.maxSito != null ? SIEVES.indexOf(S.spec.maxSito) : autoMaxSito(); return SIEVES.map((_, j) => j).filter(j => j <= (jm < 0 ? autoMaxSito() : jm)); }
const ordered = (arr, ord) => ord === 'malejąco' ? arr.slice().reverse() : arr;

/* analiza sitowa: przesiew (przechodzi) / odsiew (pozostaje na sicie) */
function analizaCols() { const c = CFG.analiza === 'odsiew' ? ['dno', ...SIEVES.map((_, j) => j)] : SIEVES.map((_, j) => j); return ordered(c, CFG.ordAnal); }
function analizaVal(m, c) {
  if (CFG.analiza === 'przesiew') return m.passing[c];
  if (c === 'dno') return m.passing[0];
  return (c + 1 < SIEVES.length ? m.passing[c + 1] : 100) - m.passing[c];
}
function ensureGrams(m) {
  if (m.grams && m.grams.r) return m.grams;
  const r = { dno: Math.round(m.passing[0] * 10) / 10 };
  SIEVES.forEach((_, j) => r[j] = Math.round(((j + 1 < SIEVES.length ? m.passing[j + 1] : 100) - m.passing[j]) * 10) / 10);
  m.grams = { m0: null, r }; return m.grams;
}
const gramCols = () => ordered(['dno', ...SIEVES.map((_, j) => j)], CFG.ordAnal);
const gSum = g => (g.r.dno || 0) + SIEVES.reduce((s, _, j) => s + (g.r[j] || 0), 0);
const gErr = g => g.m0 && Math.abs(g.m0 - gSum(g)) > 0.05 ? { sum: gSum(g), m0: g.m0, diff: gSum(g) - g.m0 } : null;
function gramsSet(m, c, v) {
  const g = ensureGrams(m); if (c === 'm0') g.m0 = v > 0 ? v : null; else g.r[c] = Math.max(0, v);
  m.gerr = gErr(g);
  if (!m.gerr) m.passing = gramsToPassing({ m0: null, r: g.r });
}
const gErrMsg = m => `Materiał „${m.name}”: suma mas ${fmt(m.gerr.sum)} g ≠ masa próbki ${fmt(m.gerr.m0)} g (różnica ${m.gerr.diff > 0 ? '+' : ''}${fmt(m.gerr.diff)} g). Nie można policzyć uziarnienia – popraw masy.`;
const matsWithErr = () => S.mats.filter(m => CFG.jednostka === 'gramy' && m.gerr);
function analizaSet(m, c, v) {
  m.grams = null;
  if (CFG.analiza === 'przesiew') { m.passing[c] = Math.max(0, Math.min(100, v)); return; }
  const r = { dno: m.passing[0] }; SIEVES.forEach((_, j) => r[j] = (j + 1 < SIEVES.length ? m.passing[j + 1] : 100) - m.passing[j]);
  r[c] = Math.max(0, v);
  const tot = r.dno + SIEVES.reduce((s, _, j) => s + r[j], 0) || 1;
  let cum = r.dno; SIEVES.forEach((_, j) => { m.passing[j] = Math.round(cum / tot * 1000) / 10; cum += r[j]; });
}

/* ---------- wykres ---------- */
function chartSVG(opt) {
  const W = 760, H = 400, L = 48, R = 18, T = 16, B = 46;
  const js = opt.sieves, dmin = SIEVES[js[0]], dmax = SIEVES[js[js.length - 1]];
  const xs = d => L + (Math.log(d) - Math.log(dmin)) / (Math.log(dmax) - Math.log(dmin)) * (W - L - R);
  const ys = v => T + (1 - v / 100) * (H - T - B);
  const pts = arr => js.filter(j => arr[j] != null).map(j => `${xs(SIEVES[j]).toFixed(1)},${ys(arr[j]).toFixed(1)}`).join(' ');
  let g = '';
  for (let v = 0; v <= 100; v += 10) g += `<line x1="${L}" x2="${W - R}" y1="${ys(v)}" y2="${ys(v)}" stroke="var(--line)" stroke-width="${v % 50 ? .6 : 1}"/><text x="${L - 8}" y="${ys(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${v}</text>`;
  js.forEach(j => { const x = xs(SIEVES[j]); g += `<line x1="${x}" x2="${x}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-width=".6"/><text x="${x}" y="${H - B + 16}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono,monospace">${fmtS(SIEVES[j])}</text>`; });
  g += `<text x="${(L + W - R) / 2}" y="${H - 8}" text-anchor="middle" font-size="12" fill="var(--muted)">wymiar boku oczka sita [mm]</text>`;
  g += `<text transform="translate(13 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle" font-size="12" fill="var(--muted)">przechodzi przez sito [%]</text>`;
  if (opt.mats) opt.mats.forEach(m => { g += `<polyline points="${pts(m.passing)}" fill="none" stroke="var(--line-strong)" stroke-width="1.2" stroke-dasharray="1 3.5" stroke-linecap="round"><title>${esc(m.name)}</title></polyline>`; });
  const band = js.map(j => `${xs(SIEVES[j]).toFixed(1)},${ys(S.spec.upper[j]).toFixed(1)}`).concat(js.slice().reverse().map(j => `${xs(SIEVES[j]).toFixed(1)},${ys(S.spec.lower[j]).toFixed(1)}`)).join(' ');
  g += `<polygon points="${band}" fill="var(--band-soft)" stroke="none"/>`;
  g += `<polyline class="pl-upper" points="${pts(S.spec.upper)}" fill="none" stroke="var(--band)" stroke-width="2.4" stroke-dasharray="1.5 3.5" stroke-linecap="round"/><polyline class="pl-lower" points="${pts(S.spec.lower)}" fill="none" stroke="var(--band)" stroke-width="2.4" stroke-dasharray="1.5 3.5" stroke-linecap="round"/>`;
  g += `<polyline class="pl-target" points="${pts(S.spec.target)}" fill="none" stroke="var(--target)" stroke-width="1.6" stroke-dasharray="7 4"/>`;
  if (opt.Y) {
    g += `<polyline points="${pts(opt.Y)}" fill="none" stroke="var(--curve)" stroke-width="2.6" stroke-linejoin="round"/>`;
    const st = sieveStatus(opt.Y);
    js.forEach(j => g += `<circle cx="${xs(SIEVES[j])}" cy="${ys(opt.Y[j])}" r="3.6" fill="${st[j] === 'ok' || st[j] === 'na' ? 'var(--curve)' : 'var(--bad)'}"/>`);
  }
  if (opt.edit) { const k = opt.edit; js.forEach(j => g += `<circle class="th" data-j="${j}" cx="${xs(SIEVES[j])}" cy="${ys(S.spec[k][j])}" r="7" fill="var(--sheet)" stroke="${k === 'target' ? 'var(--target)' : 'var(--band)'}" stroke-width="2.2" style="cursor:ns-resize"><title>Sito ${fmtS(SIEVES[j])} mm: ${fmt(S.spec[k][j])} %</title></circle>`); }
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Wykres krzywej uziarnienia" data-t="${T}" data-h="${H - T - B}">${g}</svg>`;
}

const LEGEND = `<div class="legend">

 <span><svg viewBox="0 0 26 10"><line x1="1" x2="26" y1="5" y2="5" stroke="var(--band)" stroke-width="2.4" stroke-dasharray="1.5 3.5" stroke-linecap="round"/></svg>linie kropkowane – krzywe graniczne</span></div>`;

function bindChartDrag(box, key) {
  const svg = box.querySelector('svg'); if (!svg) return;
  let drag = null;
  svg.addEventListener('pointerdown', e => { const c = e.target.closest('.th'); if (!c) return; drag = +c.dataset.j; svg.setPointerCapture(e.pointerId); e.preventDefault(); });
  svg.addEventListener('pointermove', e => {
    if (drag == null) return;
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    const T = +svg.dataset.t, Hh = +svg.dataset.h;
    let v = Math.round((1 - (p.y - T) / Hh) * 1000) / 10;
    const sp = S.spec;
    if (key === 'target') v = Math.max(sp.lower[drag], Math.min(sp.upper[drag], v));
    else if (key === 'lower') v = Math.max(0, Math.min(sp.upper[drag], v));
    else v = Math.max(sp.lower[drag], Math.min(100, v));
    sp[key][drag] = v;
    const c = svg.querySelector(`.th[data-j="${drag}"]`); c.setAttribute('cy', (T + (1 - v / 100) * Hh).toFixed(1));
    c.querySelector('title').textContent = `Sito ${fmtS(SIEVES[drag])} mm: ${fmt(v)} %`;
    svg.querySelector('.pl-' + key).setAttribute('points', [...svg.querySelectorAll('.th')].map(q => q.getAttribute('cx') + ',' + q.getAttribute('cy')).join(' '));
  });
  const end = () => { if (drag == null) return; drag = null; targetToBounds(); if (S.design && !S.design.manual) runDesign(S.design.mode, true); persist(); render(); };
  svg.addEventListener('pointerup', end); svg.addEventListener('pointercancel', end);
}
function targetToBounds() { const sp = S.spec; sp.target = sp.target.map((t, j) => Math.max(sp.lower[j], Math.min(sp.upper[j], t))); }

/* ===================== 2. DOBÓR SKŁADNIKÓW MIESZANKI ===================== */

   <tbody>${S.mats.map((m, i) => `<tr><td><input class="name" data-mf="name" data-i="${i}" value="${esc(m.name)}"></td>

   ${CFG.jednostka === 'gramy' ? vGramy() : `<h3>Analiza sitowa – ${CFG.analiza === 'odsiew' ? 'odsiew: pozostaje na sicie [%]' : 'przesiew: przechodzi przez sito [%]'}</h3>
   <p class="lede">Jednostkę (gramy / procenty), typ opisu i kolejność sit zmienisz w KONFIGURACJI PROGRAMU. Cały wiersz można wkleić z Excela do pierwszej komórki.</p>

   ${S.mats.map((m, i) => `<tr><td>${esc(m.name)}</td>${cols.map(c => `<td class="n"><input data-pass="${i}" data-c="${c}" value="${fmt(analizaVal(m, c))}" aria-label="${esc(m.name)} ${c}"></td>`).join('')}${CFG.analiza === 'odsiew' ? `<td class="n muted">${fmt(cols.reduce((s, c) => s + analizaVal(m, c), 0))}</td>` : ''}</tr>`).join('')}
   </tbody></table></div>`}</section>

   ${vDirBar()}
   <section class="sheet"><div class="sheet-head"><h2>ODCZYT ZBIORU MATERIAŁÓW Z DYSKU</h2><p>${DIR ? `Zbiory w katalogu <b>${esc(DIR.name)}</b>. „Odczyt” zastępuje zbiór w pamięci (jak w MASA), „Dołącz” dokłada materiały.` : 'Wybierz katalog roboczy (np. ZESTAW12), aby widzieć tu jego zbiory .DAT – albo wskaż pliki ręcznie.'}</p></div>
   ${DIR ? `<div class="tbl-wrap lib-list"><table><thead><tr><th>Zbiór</th><th>Rodzaj</th><th></th></tr></thead><tbody>
    ${DIRLIST.zb.map(f => `<tr><td>${esc(f.label)}${f.label === LIBNAME ? ' <span class="pill info">w pamięci</span>' : ''}</td><td class="muted">${f.kind === 'dat' ? 'MASA (.DAT)' : 'MASA Web'}</td><td class="row"><button class="btn small" data-fzload="${esc(f.name)}">Odczyt</button><button class="btn small" data-fzadd="${esc(f.name)}">Dołącz</button>${f.kind === 'json' ? `<button class="btn ghost small" data-fzdel="${esc(f.name)}">${zbConfirm === 'fdel' + f.name ? 'na pewno usunąć?' : 'Usuń'}</button>` : ''}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Brak zbiorów w katalogu.</td></tr>'}

   <div class="row"><label class="f" style="min-width:220px;flex:1">Nazwa zbioru<input id="zb-name" value="${esc(LIBNAME)}" placeholder="np. CEMEX 2026"></label>
    <button class="btn primary" data-act="zb-save" ${LIB.length ? '' : 'disabled'}>ZAPIS ZBIORU</button>
    ${DIR ? '' : `<button class="btn" data-act="zb-file" ${LIB.length ? '' : 'disabled'}>Zapis zbioru do pliku</button>`}</div>
   ${zbList().length ? `<details ${DIR ? '' : 'open'}><summary>Zbiory zapisane w przeglądarce (${zbList().length})</summary><div class="tbl-wrap"><table><thead><tr><th>Zbiór</th><th class="n">Materiałów</th><th>Zapisano</th><th></th></tr></thead><tbody>
   ${zbList().map((z, i) => `<tr><td>${esc(z.name)}${z.name === LIBNAME ? ' <span class="pill info">w pamięci</span>' : ''}</td><td class="n">${z.mats.length}</td><td class="n">${esc(z.saved)}</td><td class="row"><button class="btn small" data-zbload="${i}">Odczyt</button><button class="btn small" data-zbadd="${i}">Dołącz</button><button class="btn ghost small" data-zbdel="${i}">${zbConfirm === 'del' + i ? 'na pewno usunąć?' : 'Usuń'}</button></td></tr>`).join('')}
   </tbody></table></div></details>` : ''}
   <div class="row"><button class="btn small" data-act="lib-clear">${zbConfirm === 'clear' ? 'Na pewno? Niezapisane zmiany zbioru przepadną' : 'TWORZENIE NOWEGO ZBIORU'}</button><span class="muted">(czyści zbiór w pamięci roboczej; zapisane zbiory zostają)</span></div></section>

   <section class="sheet"><div class="sheet-head"><h2>ZBIÓR ZNAJDUJĄCY SIĘ W PAMIĘCI</h2><p>${LIB.length ? `${LIBNAME ? '<b>' + esc(LIBNAME) + '</b> · ' : ''}${LIB.length} materiałów` : 'Zbiór jest pusty. Odczytaj zbiór albo dopisz materiały ze składników mieszanki (przycisk „→ do zbioru”).'}</p></div>

     ${arr.length ? `<div class="tbl-wrap"><table><thead><tr><th>Nazwa</th><th>Orzeczenie</th><th class="n">GST</th><th class="n">&lt;0,063</th><th class="n">2 mm</th><th class="n">8 mm</th><th>Pochodzenie</th><th></th></tr></thead><tbody>
     ${arr.map(({ m, i }) => `<tr><td>${esc(m.name)}</td><td>${esc(m.cert)}</td><td class="n">${fmt(m.density, 3)}</td><td class="n">${fmt(m.passing[0])}</td><td class="n">${fmt(m.passing[5])}</td><td class="n">${fmt(m.passing[8])}</td><td class="muted">${esc(m.producer)} · ${esc(m.source)}</td><td><button class="btn small" data-ladd="${i}" ${S.mats.length >= 9 ? 'disabled' : ''}>[Enter] wybór</button> <button class="btn ghost small" data-ldel="${i}">[F8] kasuj</button></td></tr>`).join('')}
     </tbody></table></div>` : ''}</details>`; }).join('')}
   <p class="muted">DODATKI SPECJALNE DO MIESZ. MINERALNEJ – dodaj jako materiał w odpowiedniej grupie (np. granulat gumowy).</p>
   </section>`;
}

function vGramy() {
  const cols = gramCols(), jcols = cols.filter(c => c !== 'dno');
  return `<h3>Analiza sitowa – pozostaje na sicie [g]</h3>
   <p class="lede">Wpisz masę próbki i masy pozostałe na poszczególnych sitach oraz na dnie. Suma mas musi być równa masie próbki – inaczej uziarnienie nie zostanie policzone. Bez masy próbki program liczy od sumy pozostałości. Cały wiersz można wkleić z Excela.</p>
   ${matsWithErr().map(m => `<p class="note bad">${esc(gErrMsg(m))}</p>`).join('')}
   <div class="tbl-wrap"><table><thead><tr><th>Materiał</th><th class="n">Masa próbki [g]</th>${cols.map(c => `<th class="n">${c === 'dno' ? 'dno' : fmtS(SIEVES[c])}</th>`).join('')}<th class="n">Suma [g]</th><th class="n">Różnica [g]</th></tr></thead><tbody>
   ${S.mats.map((m, i) => { const g = ensureGrams(m), sum = gSum(g), ub = g.m0 ? sum - g.m0 : null; m.gerr = gErr(g); return `<tr><td>${esc(m.name)}</td><td class="n"><input data-g="${i}" data-c="m0" value="${g.m0 ? fmt(g.m0) : ''}" placeholder="–" aria-label="${esc(m.name)} masa próbki"></td>${cols.map(c => `<td class="n"><input data-g="${i}" data-c="${c}" value="${fmt(g.r[c] || 0)}" aria-label="${esc(m.name)} ${c}"></td>`).join('')}<td class="n ${m.gerr ? 'out' : ''}">${fmt(sum)}</td><td class="n ${m.gerr ? 'out' : 'muted'}">${ub == null ? '–' : (ub > 0 ? '+' : '') + fmt(ub)}</td></tr>
    <tr class="pass-row"><td class="muted">przechodzi [%]</td><td></td>${m.gerr ? `<td colspan="${cols.length + 2}" class="out">błąd – suma mas nie zgadza się z masą próbki, nie można policzyć</td>` : cols.map(c => `<td class="n muted">${c === 'dno' ? '' : fmt(m.passing[c])}</td>`).join('') + '<td></td><td></td>'}</tr>`; }).join('')}
   </tbody></table></div>`;
}

/* ===================== 3. OBLICZENIE SKŁADU MIESZANKI ===================== */
function vSkl() {
  const x = currentX(), Y = currentY(), js = visibleSieves(), jo = ordered(js, CFG.ordUz);
  const d = S.design, mode = d?.mode || 'grading';
  let status = '';
  if (d && Y) { const st = sieveStatus(Y); const bad = js.filter(j => st[j] === 'low' || st[j] === 'high'); status = bad.length ? `<span class="pill bad">poza polem dobrego uziarnienia na ${bad.length} ${bad.length === 1 ? 'sicie' : 'sitach'}</span>` : `<span class="pill ok">w polu dobrego uziarnienia</span>`; }
  const cost = x ? S.mats.reduce((s, m, i) => s + x[i] / 100 * (+m.price || 0), 0) : null;
  const anyPrice = false;
  return `<section class="sheet"><div class="sheet-head"><h2>GRANICZNE UDZIAŁY MATERIAŁÓW</h2><p>Standardowo udział zawiera się w przedziale 0 ÷ 100 %.</p></div>
   <div class="tbl-wrap"><table><thead><tr><th>Materiał</th><th class="n">Min. udział [%]</th><th class="n">Max. udział [%]</th></tr></thead><tbody>
    ${S.mats.map((m, i) => `<tr><td>${esc(m.name)}</td><td class="n"><input data-mf="min" data-i="${i}" value="${fmt(+m.min || 0)}"></td><td class="n"><input data-mf="max" data-i="${i}" value="${fmt(m.max === '' || m.max == null ? 100 : +m.max)}"></td></tr>`).join('') || '<tr><td colspan="3" class="muted">Najpierw DOBÓR SKŁADNIKÓW MIESZANKI.</td></tr>'}
   </tbody></table></div>
   ${(() => { const sMin = S.mats.reduce((s, q) => s + (+q.min || 0), 0), sMax = S.mats.reduce((s, q) => s + (q.max == null || q.max === '' ? 100 : +q.max), 0); return sMin > 100 ? `<p class="note bad">Suma minimalnych udziałów (${fmt(sMin)} %) przekracza 100 % – obliczenie składu jest niemożliwe. Zmniejsz minima.</p>` : sMax < 100 && S.mats.length ? `<p class="note bad">Suma maksymalnych udziałów (${fmt(sMax)} %) jest mniejsza niż 100 % – obliczenie składu jest niemożliwe. Zwiększ maksima.</p>` : ''; })()}</section>

   <section class="sheet"><div class="sheet-head"><h2>OBLICZENIE SKŁADU MIESZANKI</h2>${status}</div>
   <div class="row"><div class="seg seg-col" role="group" aria-label="Optymalizacja">
    <button data-run="grading" aria-pressed="${mode === 'grading' && !d?.manual}">OPTYMALIZACJA UZIARNIENIA MIESZANKI (z uwzg. krzywych gr.)</button>
    <button data-run="free" aria-pressed="${mode === 'free' && !d?.manual}">OPTYMALIZACJA UZIARNIENIA MIESZANKI (bez uwzg. krzywych gr.)</button></div></div>
   ${d?.infeasible ? `<p class="note bad">Brak rozwiązania w krzywych granicznych (sita: ${d.violated.map(j => fmtS(SIEVES[j])).join(', ')} mm). Pokazano mieszankę najbliższą granicom. Zmień materiały lub użyj OPTYMALIZACJI UZIARNIENIA MIESZANKI (bez uwzg. krzywych gr.).</p>` : ''}
   ${designDirty ? '<p class="note">Zmieniono dane – ponów obliczenie składu.</p>' : ''}
   ${matsWithErr().map(m => `<p class="note bad">${esc(gErrMsg(m))} (DOBÓR SKŁADNIKÓW MIESZANKI → Analiza sitowa)</p>`).join('')}
   <label class="row" style="gap:6px"><input type="checkbox" id="mat-curves" ${CFG.matCurves ? 'checked' : ''} style="width:auto">pokaż krzywe materiałów</label>
   <div class="chart-box" id="chart">${chartSVG({ sieves: js, Y, mats: CFG.matCurves ? S.mats : null })}</div>${CFG.matCurves ? LEGEND.replace('</div>', LEGEND_MAT + '</div>') : LEGEND}
   <div class="grid2">
    <div class="tbl-wrap"><table><thead><tr><th>Składnik</th><th class="n">Udział [%]</th>${anyPrice ? '<th class="n">Cena</th>' : ''}</tr></thead><tbody>
     ${S.mats.map((m, i) => `<tr><td>${esc(m.name)}</td><td class="n"><input data-x="${i}" value="${x ? fmt(S.design.x[i], CFG.dec === 0 ? 0 : 2) : ''}" aria-label="udział ${esc(m.name)}"></td>${anyPrice ? `<td class="n">${fmt(+m.price || 0, 2)}</td>` : ''}</tr>`).join('')}
     <tr class="sum"><td>Razem${x && Math.abs(rawSum() - 100) > 0.005 ? ' <span class="pill warn">przeliczane do 100 %</span> <button class="btn small" data-act="norm">Normalizuj</button>' : ''}</td><td class="n">${x ? fmt(rawSum(), 2) : '–'}</td>${anyPrice ? `<td class="n">${fmt(cost, 2)} zł/t</td>` : ''}</tr></tbody></table></div>
    <dl class="kv">
     <dt>Gęstość mieszanki mineralnej</dt><dd>${x ? fmt(aggDensity(S.mats, x), 3) + ' g/cm³' : '–'}</dd>
     <dt>Odchylenie od krzywej wzorcowej</dt><dd>${Y ? fmt(Math.sqrt(js.reduce((s, j) => s + (Y[j] - S.spec.target[j]) ** 2, 0) / js.length), 2) + ' %' : '–'}</dd>
     ${anyPrice && x ? `<dt>Cena mieszanki</dt><dd>${fmt(cost, 2)} zł/t</dd>` : ''}
    </dl></div>
   <h3>Tabela uziarnienia</h3>
   <div class="tbl-wrap"><table><thead><tr><th>Sito [mm]</th>${jo.map(j => `<th class="n">${fmtS(SIEVES[j])}</th>`).join('')}</tr></thead><tbody>
    ${S.mats.map((m, i) => `<tr><td class="muted">${esc(m.name)}${x ? ` · ${fd(x[i])} %` : ''}</td>${jo.map(j => `<td class="n muted">${x ? fd(x[i] * m.passing[j] / 100) : fd(m.passing[j])}</td>`).join('')}</tr>`).join('')}
    ${Y ? (() => { const st = sieveStatus(Y); return `<tr class="sum"><td>Mieszanka mineralna</td>${jo.map(j => `<td class="n ${st[j] === 'low' || st[j] === 'high' ? 'out' : ''}">${fd(Y[j])}</td>`).join('')}</tr>`; })() : ''}
    <tr><td class="muted">Krzywe graniczne</td>${jo.map(j => `<td class="n muted">${fmt(S.spec.lower[j], 0)}–${fmt(S.spec.upper[j], 0)}</td>`).join('')}</tr>
    <tr><td class="muted">Krzywa wzorcowa</td>${jo.map(j => `<td class="n muted">${fd(S.spec.target[j])}</td>`).join('')}</tr>
   </tbody></table></div></section>`;
}

/* ===================== 4. OBLICZENIE ILOŚCI LEPISZCZA ===================== */
const K_ORIENT = [
  ['podb', 'AC P – podbudowa', '2,8 – 3,2'], ['wiaz', 'AC W – warstwa wiążąca', '3,2 – 3,5'], ['scier', 'AC S – warstwa ścieralna', '3,5 – 3,8'],
  ['wms', 'AC WMS', '3,4 – 3,7'], ['bbtm', 'BBTM', '3,4 – 3,8'], ['sma', 'SMA', '3,8 – 4,2'], ['pa', 'PA – asfalt porowaty', '3,0 – 3,4']];
function kRowFor(name) {
  const n = name || '';
  if (/SMA/.test(n)) return 'sma'; if (/BBTM/.test(n)) return 'bbtm'; if (/WMS/.test(n)) return 'wms'; if (/^PA /.test(n)) return 'pa';
  if (/AC \d+ P/.test(n)) return 'podb'; if (/AC \d+ W/.test(n)) return 'wiaz'; if (/AC \d+ S/.test(n)) return 'scier'; return null;
}
function kHint() {
  const cur = kRowFor(S.spec.name);
  return `<div class="khint"><div class="muted">K orientacyjnie (praktyka francuska, do sprawdzenia serią próbek):</div><table>${K_ORIENT.map(([k, l, v]) => `<tr class="${k === cur ? 'cur' : ''}"><td>${l}</td><td class="n">${v}</td></tr>`).join('')}</table>${/^MA /.test(S.spec.name) ? '<div class="muted">Asfalt lany (MA): metoda nieodpowiednia – mieszanka bezporowa.</div>' : ''}</div>`;
}
function vLep() {
  const r = binderResults();
  const bsel = `<label class="f" style="max-width:420px">Rodzaj lepiszcza<select id="bsel">${S.binders.map(b => `<option value="${b.id}" ${b.id === S.binderId ? 'selected' : ''}>${esc(b.name)} · ${fmt(b.density, 3)} g/cm³</option>`).join('')}</select></label>`;
  if (!r) return `<section class="sheet"><h2>OKREŚLENIE RODZAJU LEPISZCZA</h2>${bsel}<p class="note">Najpierw OBLICZENIE SKŁADU MIESZANKI.</p></section>`;
  const p = S.binder.p, m = S.binder.method, o = r.out;
  const inp = (meth, key, label, v, d = 2) => `<label class="f">${label}<input data-bp="${meth}.${key}" value="${v == null ? '' : fmt(v, d)}"></label>`;
  const card = (k, inputs, extra) => `<div class="method" role="radio" tabindex="0" aria-checked="${m === k}" data-meth="${k}">
     <h3>${METODY[k][0]}</h3>${METODY[k][1] ? `<div class="formula">${METODY[k][1]}</div>` : ''}<div class="fields">${inputs}</div>
     <div class="res">${fmt(o[k].B, 2)} %<span class="muted sub">w MMA · Ak = ${fmt(o[k].ak, 2)} % (na kruszywo)</span></div>${extra || ''}</div>`;
  const bminA = S.spec.bmin ? S.spec.bmin * 2.65 / r.rhoAgg : null;
  const t = S.trial, x = currentX(), rows = trialMix(S.mats, x, r.B, t.mass, t.step, t.n);
  return `<section class="sheet"><h2>OKREŚLENIE RODZAJU LEPISZCZA</h2>${bsel}</section>
  <section class="sheet"><div class="sheet-head"><h2>OBLICZENIE OPTYMALNEJ ILOŚCI LEPISZCZA</h2><p>Do obliczeń przyjęta będzie ostatnio wybrana metoda (kliknij kartę).</p></div>
   <div class="grid3">
    ${card('voids', inp('voids', 'P', 'P – wolna przestrzeń w mieszance min. [%]', p.voids.P, 1) + inp('voids', 'n', 'n – poprawka [%]', p.voids.n, 1) + inp('voids', 'gkp', 'gkp – gęstość objęt. mieszanki min. [g/cm³]', p.voids.gkp, 3), `<div class="muted">ga = ${fmt(r.rhoB, 3)} g/cm³</div>`)}
    ${card('film', inp('film', 'b', 'b – grubość otoczki lepiszcza [µm]', p.film.b, 1), `<div class="muted">F = ${fmt(o.film.F, 2)} m²/kg · ga = ${fmt(r.rhoB, 3)}</div>`)}

    <tr><td>Gęstość objętościowa próbek [g/cm³]</td>${rows.map((rw, k) => `<td class="n"><input data-bulk="${k}" value="${t.bulk[k] ? fmt(t.bulk[k], 3) : ''}" aria-label="gęstość objętościowa seria ${k + 1}"></td>`).join('')}</tr>
    ${['Vm', 'VMA', 'VFB'].map(q => `<tr><td>${{ Vm: 'Wolna przestrzeń Vm [%]', VMA: 'VMA [%]', VFB: 'VFB [%]' }[q]}</td>${rows.map((rw, k) => { const v = volumetrics(maxDensity(r.rhoAgg, rw.B, r.rhoB), t.bulk[k], rw.B, r.rhoB); return `<td class="n">${v ? fmt(v[q], 1) : '–'}</td>`; }).join('')}</tr>`).join('')}
   </tbody></table></div>
   <p class="muted">DODATKI SPECJALNE DO LEPISZCZA – w tej wersji nie są obliczane.</p></section>`;

  <section class="sheet"><div class="sheet-head"><h2>OPRACOWANIE RECEPTY ROBOCZEJ</h2><span class="pill info">zarób ${fmt(c.batch, 0)} kg · lepiszcze ${fmt(r.B, 2)} %</span></div>
   <div class="grid2">

function reportHTML(sel = podglad) {
  const x = currentX(), Y = currentY(), r = binderResults(), js = ordered(visibleSieves(), CFG.ordUz);
  const tr = cells => `<tr>${cells.join('')}</tr>`;
  const th = (a, b) => `<tr><th style="text-align:left">${a}</th><td>${b}</td></tr>`;
  let h = `<h1>${esc(S.meta.name)}</h1><table><tbody>${[['Rodzaj M.M.A.', S.spec.desc], ['Symbol normy', NORMY[S.spec.norm] || ''], ['Data', S.meta.date], ['Rodzaj lepiszcza', binder().name + ' (' + fmt(binder().density, 3) + ' g/cm³)']].filter(a => a[1]).map(a => th(a[0], esc(a[1]))).join('')}</tbody></table>`;
  if (!x) return h + '<p>Brak obliczonego składu mieszanki.</p>';
  if (sel.mm) {
    h += `<h2>MIESZANKA MINERALNA</h2><table><thead><tr><th>Materiał</th><th>Gęstość [g/cm³]</th><th>Udział [%]</th></tr></thead><tbody>
     ${S.mats.map((m, i) => tr([`<td>${esc(m.name)}</td>`, `<td class="n">${fmt(m.density, 3)}</td>`, `<td class="n">${fd(x[i])}</td>`])).join('')}
     ${tr(['<td><b>Razem</b></td>', `<td class="n">${fmt(aggDensity(S.mats, x), 3)}</td>`, `<td class="n">${fd(100)}</td>`])}</tbody></table>
     <table><thead><tr><th>Sito [mm]</th>${js.map(j => `<th>${fmtS(SIEVES[j])}</th>`).join('')}</tr></thead><tbody>
     ${tr(['<td>Mieszanka mineralna [%]</td>', ...js.map(j => `<td class="n">${fd(Y[j])}</td>`)])}
     ${tr(['<td>Krzywe graniczne [%]</td>', ...js.map(j => `<td class="n">${fmt(S.spec.lower[j], 0)}–${fmt(S.spec.upper[j], 0)}</td>`)])}
     ${tr(['<td>Krzywa wzorcowa [%]</td>', ...js.map(j => `<td class="n">${fd(S.spec.target[j])}</td>`)])}</tbody></table>`;
  }
  if (sel.wykres) h += `<h2>WYKRES KRZYWEJ UZIARNIENIA</h2><div style="max-width:720px">${chartSVG({ sieves: visibleSieves(), Y }).replace(/var\(--line-strong\)/g, '#999').replace(/var\(--line\)/g, '#ddd').replace(/var\(--muted\)/g, '#555').replace(/var\(--band-soft\)/g, 'rgba(233,196,106,.25)').replace(/var\(--band\)/g, '#b8862a').replace(/var\(--target\)/g, '#2c5468').replace(/var\(--curve\)/g, '#111').replace(/var\(--bad\)/g, '#b03a2e').replace(/var\(--sheet\)/g, '#fff')}</div><p style="font-size:.85em">linia ciągła – projektowana krzywa optymalna; linia przerywana – krzywa wzorcowa; linie kropkowane – krzywe graniczne</p>`;
  if (r && sel.mma) {
    h += `<h2>MIESZANKA MINERALNO-ASFALTOWA</h2><table><thead><tr><th>Składnik</th><th>Udział w MMA [%]</th></tr></thead><tbody>
      ${S.mats.map((m, i) => tr([`<td>${esc(m.name)}</td>`, `<td class="n">${fd(x[i] * (100 - r.B) / 100)}</td>`])).join('')}
      ${tr([`<td>Lepiszcze ${esc(binder().name)}</td>`, `<td class="n">${fmt(r.B, 2)}</td>`])}</tbody></table>
      <table><tbody>${th('Metoda obliczenia ilości lepiszcza', METODY[S.binder.method][0] + (METODY[S.binder.method][1] ? ', ' + METODY[S.binder.method][1] : ''))}
      ${th('Ilość lepiszcza w MMA', fmt(r.B, 2) + ' %')}${th('Ak – na kruszywo', fmt(r.ak, 2) + ' %')}
      ${S.spec.bmin ? th('B<sub>min</sub>·α', fmt(S.spec.bmin * 2.65 / r.rhoAgg, 2) + ' %') : ''}
      ${th('Gęstość mieszanki mineralnej', fmt(r.rhoAgg, 3) + ' g/cm³')}${th('Gęstość MMA (teoretyczna)', fmt(r.rhoMax, 3) + ' g/cm³')}</tbody></table>`;
  }
  if (r && sel.zarob) {
    const t = S.trial, rows = trialMix(S.mats, x, r.B, t.mass, t.step, t.n);
    h += `<h2>ZARÓB PRÓBNY (${fmt(t.mass, 0)} g)</h2><table><thead><tr><th>Składnik [g]</th>${rows.map(rw => `<th>${fmt(rw.B, 2)} %</th>`).join('')}</tr></thead><tbody>
      ${S.mats.map((m, i) => tr([`<td>${esc(m.name)}</td>`, ...rows.map(rw => `<td class="n">${fd(rw.comps[i].g)}</td>`)])).join('')}
      ${tr(['<td>Lepiszcze</td>', ...rows.map(rw => `<td class="n">${fd(rw.mb)}</td>`)])}
      ${t.bulk.some(v => v) ? ['Vm', 'VMA', 'VFB'].map(q => tr([`<td>${q} [%]</td>`, ...rows.map((rw, k) => { const v = volumetrics(maxDensity(r.rhoAgg, rw.B, r.rhoB), t.bulk[k], rw.B, r.rhoB); return `<td class="n">${v ? fmt(v[q], 1) : '–'}</td>`; })])).join('') : ''}</tbody></table>`;
  }
  if (r && sel.rec) {
    const c = S.plant, rec = plantCalc(r);
    h += `<h2>RECEPTURA ROBOCZA (zarób ${fmt(c.batch, 0)} kg)</h2><table><thead><tr><th>Składnik</th><th>Udział [%]</th><th>Masa [kg]</th><th>Narastająco [kg]</th></tr></thead><tbody>
      ${rec.bins.map(b => tr([`<td>Komora ${b.to == null ? '&gt; ' + fmtS(b.from) : fmtS(b.from) + '–' + fmtS(b.to)} mm</td>`, `<td class="n">${fd(b.share)}</td>`, `<td class="n">${fd(b.kg)}</td>`, `<td class="n">${fd(b.cum)}</td>`])).join('')}
      ${c.fillerSeparate ? tr(['<td>Wypełniacz</td>', `<td class="n">${fd(rec.xF)}</td>`, `<td class="n">${fd(rec.filler)}</td>`, '<td></td>']) : ''}
      ${tr([`<td>Lepiszcze (${c.binderByMass ? 'wagowo' : 'objętościowo'})</td>`, `<td class="n">${fmt(r.B, 2)}</td>`, `<td class="n">${fd(rec.mb)}</td>`, `<td class="n">${c.binderByMass ? '' : fd(rec.binderL) + ' l'}</td>`])}</tbody></table>
      <p>Temperatura robocza lepiszcza ${c.tBinder} °C, kruszywa ${c.tAgg} °C, gotowej MMA ${c.tMix} °C, optymalna temp. zagęszczania ${c.tComp} °C.</p>`;
  }
  h += `<p style="color:#777;font-size:.8em;margin-top:24px">MASA Web · ${new Date().toLocaleDateString('pl-PL')}</p>`;
  return h;
}

function wynToProject(q) {

  let best = MIXLIB[0], bd = Infinity;
  MIXLIB.forEach(l => { const s = l.target.reduce((acc, t, j) => acc + (t - q.target[j]) ** 2, 0); if (s < bd) { bd = s; best = l; } });
  p.spec = specFromLib(best.id); p.spec.target = q.target.slice(0, 14).concat([100]);
  if (bd > 1) toast('Rodzaj M.M.A. dobrany po krzywej wzorcowej (' + best.name + ') – sprawdź w PRZYJĘCIU ZAŁOŻEŃ PROJEKTU.');

    case 'lib-clear': if (zbConfirm !== 'clear' && LIB.length) { zbConfirm = 'clear'; break; } LIB = []; LIBNAME = ''; zbConfirm = ''; toast('Utworzono nowy, pusty zbiór.'); break;
    case 'zb-save': saveZbior(); return;
    case 'zb-file': { const nm = ($('#zb-name')?.value || '').trim() || LIBNAME || 'zbior'; saveFile(safeName(nm) + '_zbior.json', JSON.stringify({ format: 'masaweb-zbior', name: nm, mats: LIB }, null, 1), 'application/json'); return; }
    case 'norm': S.design.x = currentX().map(v => Math.round(v * 100) / 100); break;
    case 'print': printReport(); return;
    case 'csv-save': { const Y = currentY(); const rows = [['Sito [mm]', ...SIEVES]].concat(S.mats.map(m => [m.name, ...m.passing])); if (Y) rows.push(['Mieszanka mineralna', ...Y.map(v => Math.round(v * 10) / 10)]); rows.push(['Krzywa dolna', ...S.spec.lower], ['Krzywa górna', ...S.spec.upper], ['Krzywa wzorcowa', ...S.spec.target]); saveFile(safeName(S.meta.name) + '_uziarnienie.csv', '﻿' + rows.map(r => r.map(v => typeof v === 'number' ? String(v).replace('.', ',') : '"' + String(v).replace(/"/g, '""') + '"').join(';')).join('\r\n'), 'text/csv'); return; }
    case 'new': S = newProject(); tab = 'zal'; toast('Nowa recepta.'); break;
    case 'open': $('#open-file').click(); return;
    case 'save': saveFile(safeName(S.meta.name) + '.json', JSON.stringify({ format: 'masaweb', version: 2, project: S }, null, 1), 'application/json'); return;
    case 'db-save': saveRecipe(); return;
    case 'dir': (DIRPENDING && !DIR) ? reconnectDir() : pickDir(); return;
    case 'dir-refresh': refreshDir(); return;
    case 'cfg-save': saveCfg(); break;
    case 'cfg-reset': CFG = { ...CFG_DEF }; break;
    default: return;
  }
  render();
}

let pointerDown = false, pendingRender = false;
function scheduleRender() { if (pointerDown) pendingRender = true; else render(); }
document.addEventListener('pointerdown', () => { pointerDown = true; }, true);
document.addEventListener('pointerup', () => { pointerDown = false; if (pendingRender) setTimeout(() => { if (pendingRender) { pendingRender = false; render(); } }, 0); }, true);
function onChange(e) {
  const t = e.target, d = t.dataset, v = t.value;
  if (t.id === 'dat-file') { importDatFiles(t.files); return; }
  if (t.id === 'wyn-file') { const f = t.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try { setWyn(rd.result, f.name, WYN?.zestaw || 12); toast('Odczytano ' + WYN.list.length + ' recept z ' + f.name + '.'); scheduleRender(); } catch (e) { toast('To nie jest plik BAZA_MMB.WYN.'); } }; rd.readAsArrayBuffer(f); return; }
  if (t.id === 'wyn-z') { setWyn(WYN.buf, WYN.file, +v); scheduleRender(); return; }
  if (t.id === 'wyn-q') { wynQ = v; scheduleRender(); return; }
  if (t.id === 'zb-name') { LIBNAME = v.trim(); persist(); return; }
  if (t.id === 'open-file') {
    const f = t.files[0]; if (!f) return; const rd = new FileReader();
    rd.onload = () => { try { const o = JSON.parse(rd.result); if (!o.project?.spec) throw 0; S = o.project; if (!S.binderId) { S.binders = clone(LEPISZCZA); S.binderId = PARAM.binderId; } tab = 'skl'; scheduleRender(); toast('Odczytano ' + f.name); } catch (er) { toast('To nie jest plik recepty MASA Web.'); } t.value = ''; };
    rd.readAsText(f); return;
  }
  if (t.id?.startsWith('m-')) { S.meta[t.id.slice(2)] = v; scheduleRender(); return; }
  if (t.id === 'mix-sel') { if (v !== 'custom') S.spec = specFromLib(v); else { S.spec.libId = 'custom'; S.spec.name = 'Nowy rodzaj M.M.A.'; S.spec.desc = 'Nowy rodzaj M.M.A.'; krzywaTryb = 'tekst'; } if (S.design) runDesign(S.design.mode, true); scheduleRender(); return; }
  if (t.id === 'sp-name') { S.spec.desc = v; if (S.spec.libId === 'custom') S.spec.name = v; scheduleRender(); return; }
  if (t.id === 'sp-przezn') { S.spec.przezn = v; return; }
  if (t.id === 'sp-norm') { S.spec.norm = v ? +v : null; scheduleRender(); return; }
  if (t.id === 'sp-bmin') { S.spec.bmin = pnum(v); scheduleRender(); return; }
  if (t.id === 'sp-max') { S.spec.maxSito = v === '' ? null : +v; scheduleRender(); return; }
  if (d.spec) { const n = pnum(v); if (n != null) S.spec[d.spec][+d.j] = n; designDirty = !!S.design; scheduleRender(); return; }
  if (d.actOn != null) { S.spec.active[+d.actOn] = t.checked; designDirty = !!S.design; scheduleRender(); return; }
  if (d.bnd != null) { S.binderId = +d.bnd; scheduleRender(); return; }
  if (d.bf) { const bb = S.binders.find(x => x.id === +d.id); if (d.bf === 'name') bb.name = v; else { const n = pnum(v); if (d.bf === 'density') { if (n) bb.density = n; } else bb[d.bf] = n; } scheduleRender(); return; }
  if (t.id === 'bsel') { S.binderId = +v; scheduleRender(); return; }
  if (d.mf) {
    const m = S.mats[+d.i]; const f = d.mf;
    if (['name', 'cert', 'producer', 'src'].includes(f)) m[f] = v; else if (f === 'group') m.group = +v;
    else if (f === 'min' || f === 'max') {
      let n = pnum(v), msg = '';
      if (n == null) { n = f === 'max' ? 100 : 0; if (v.trim() !== '') msg = 'Wpisz liczbę od 0 do 100.'; }
      if (n > 100) { n = 100; msg = 'Udział nie może przekraczać 100 % – wpisano 100.'; }
      if (n < 0) { n = 0; msg = 'Udział nie może być ujemny – wpisano 0.'; }
      const lo = f === 'min' ? n : (+m.min || 0), hi = f === 'max' ? n : (m.max == null || m.max === '' ? 100 : +m.max);
      if (lo > hi) { n = f === 'min' ? hi : lo; msg = `Min. udział nie może być większy od max. – wpisano ${fmt(n)} %.`; }
      m[f] = n;
      const sMin = S.mats.reduce((s, q) => s + (+q.min || 0), 0), sMax = S.mats.reduce((s, q) => s + (q.max == null || q.max === '' ? 100 : +q.max), 0);
      if (!msg && sMin > 100) msg = `Suma minimalnych udziałów wynosi ${fmt(sMin)} % – przekracza 100 %.`;
      if (!msg && sMax < 100) msg = `Suma maksymalnych udziałów wynosi ${fmt(sMax)} % – nie osiąga 100 %.`;
      if (msg) toast(msg);
    }
    else { const n = pnum(v); m[f] = n == null ? 0 : n; }
    if (['min', 'max'].includes(f) && S.design) designDirty = true;
    scheduleRender(); return;
  }
  if (d.g != null) { const n = pnum(v); const m = S.mats[+d.g]; if (n != null || d.c === 'm0') { const c = d.c === 'm0' ? 'm0' : d.c === 'dno' ? 'dno' : +d.c; gramsSet(m, c, n ?? 0); const g = m.grams; if (m.gerr) toast(gErrMsg(m)); } if (S.design) designDirty = true; scheduleRender(); return; }
  if (d.pass != null) { const n = pnum(v); if (n != null) analizaSet(S.mats[+d.pass], d.c === 'dno' ? 'dno' : +d.c, n); if (S.design) designDirty = true; scheduleRender(); return; }
  if (d.x != null) { let n = pnum(v); if (n == null || !S.design) return; if (n > 100 || n < 0) { n = Math.max(0, Math.min(100, n)); toast('Udział musi mieścić się w przedziale 0 ÷ 100 %.'); } S.design.x[+d.x] = n; S.design.manual = true; S.design.infeasible = false; scheduleRender(); return; }
  if (d.bp) { const [m, k] = d.bp.split('.'); S.binder.p[m][k] = k === 'basis' ? v : k === 'useAlpha' ? t.checked : pnum(v); S.binder.method = m; scheduleRender(); return; }
  if (d.pg) { podglad[d.pg] = t.checked; scheduleRender(); return; }
  if (t.id === 't-mass') { S.trial.mass = pnum(v) || 1200; scheduleRender(); return; }
  if (t.id === 't-step') { S.trial.step = pnum(v) ?? 0.3; scheduleRender(); return; }
  if (t.id === 't-n') { S.trial.n = +v; S.trial.bulk = []; scheduleRender(); return; }
  if (d.bulk != null) { S.trial.bulk[+d.bulk] = pnum(v); scheduleRender(); return; }
  const pmap = { 'p-batch': 'batch', 'p-rate': 'rate', 'p-tb': 'tBinder', 'p-ta': 'tAgg', 'p-tm': 'tMix', 'p-tc': 'tComp' };
  if (pmap[t.id]) { S.plant[pmap[t.id]] = pnum(v) ?? S.plant[pmap[t.id]]; scheduleRender(); return; }
  if (t.id === 'p-fill') { S.plant.fillerSeparate = v === '1'; scheduleRender(); return; }
  if (t.id === 'p-bmode') { S.plant.binderByMass = v === '1'; scheduleRender(); return; }
  if (d.bin != null) { const dd = +d.bin; S.plant.binSieves = t.checked ? [...S.plant.binSieves, dd] : S.plant.binSieves.filter(q => q !== dd); scheduleRender(); return; }
  const cmap = { 'c-jd': 'jednostka', 'c-an': 'analiza', 'c-oa': 'ordAnal', 'c-ou': 'ordUz', 'c-or': 'ordRec' };
  if (cmap[t.id]) { CFG[cmap[t.id]] = v; scheduleRender(); return; }
  if (t.id === 'mat-curves') { CFG.matCurves = t.checked; lsSet(LS_CFG, { ...(lsGet(LS_CFG) || {}), cfg: CFG }); scheduleRender(); return; }
  if (t.id === 'c-dec') { CFG.dec = +v; scheduleRender(); return; }
}

function onPaste(e) {
  const t = e.target; if (!t.dataset || (t.dataset.pass == null && t.dataset.g == null)) return;
  if (t.dataset.g != null) {
    const vals = (e.clipboardData || window.clipboardData).getData('text').trim().split(/[\t;\n\r]+/).map(pnum).filter(v => v != null);
    if (vals.length < 2) return; e.preventDefault();
    const m = S.mats[+t.dataset.g], cols = ['m0', ...gramCols()], k0 = cols.findIndex(c => String(c) === t.dataset.c);
    vals.forEach((v, k) => { if (k0 + k < cols.length) gramsSet(m, cols[k0 + k], v); });
    if (S.design) designDirty = true; render(); toast(`Wklejono ${Math.min(vals.length, cols.length - k0)} wartości.`); return;
  }
  const txt = (e.clipboardData || window.clipboardData).getData('text');
  const vals = txt.trim().split(/[\t;\n\r]+/).map(pnum).filter(v => v != null);
  if (vals.length < 2) return;
  e.preventDefault();
  const i = +t.dataset.pass, cols = analizaCols(), k0 = cols.findIndex(c => String(c) === t.dataset.c);
  const m = S.mats[i];
  if (CFG.analiza === 'przesiew') vals.forEach((v, k) => { if (k0 + k < cols.length) m.passing[cols[k0 + k]] = Math.max(0, Math.min(100, v)); });
  else vals.forEach((v, k) => { if (k0 + k < cols.length) analizaSet(m, cols[k0 + k], v); });
  if (S.design) designDirty = true; render(); toast(`Wklejono ${Math.min(vals.length, cols.length - k0)} wartości.`);
}

document.addEventListener('click', onClick);
document.addEventListener('change', onChange);
document.addEventListener('paste', onPaste);
document.addEventListener('keydown', e => { const m = e.target.closest?.('[data-meth]'); if (m && (e.key === 'Enter' || e.key === ' ') && e.target === m) { e.preventDefault(); S.binder.method = m.dataset.meth; render(); } });
document.addEventListener('dragover', e => { const dz = e.target.closest?.('#drop'); if (dz) { e.preventDefault(); dz.classList.add('over'); } });
document.addEventListener('dragleave', e => { const dz = e.target.closest?.('#drop'); if (dz) dz.classList.remove('over'); });
document.addEventListener('drop', e => { const dz = e.target.closest?.('#drop'); if (dz) { e.preventDefault(); dz.classList.remove('over'); importDatFiles(e.dataTransfer.files); } });

load(); render(); initDir();
</script>
